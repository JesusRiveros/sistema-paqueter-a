{# Widget del asistente Lula. Se carga en todas las páginas públicas. #}
<div class="lula" id="lula" data-api="{{ url_for('asistente_mensaje') }}" data-historial="{{ url_for('asistente_historial') }}"
     data-reiniciar="{{ url_for('asistente_reiniciar') }}" data-csrf="{{ csrf_token() }}">
  <button type="button" class="lula-fab" id="lula-abrir" aria-controls="lula-panel" aria-expanded="false">
    <i class="fa-solid fa-comment-dots" aria-hidden="true"></i>
    <span>¿Te ayudo?</span>
  </button>

  <section class="lula-panel" id="lula-panel" role="dialog" aria-modal="false" aria-labelledby="lula-titulo" hidden>
    <header class="lula-head">
      <div class="lula-avatar" aria-hidden="true"><img src="{{ url_for('static', filename='img/logo-blanco.png') }}" alt=""></div>
      <div class="flex-grow-1">
        <h2 id="lula-titulo">Lula · Atención a clientes</h2>
        <p><span class="lula-dot"></span> En línea · respondo en segundos</p>
      </div>
      <button type="button" class="lula-icon-btn" id="lula-nueva" title="Nueva conversación" aria-label="Nueva conversación"><i class="fa-solid fa-rotate-right"></i></button>
      <button type="button" class="lula-icon-btn" id="lula-cerrar" title="Cerrar" aria-label="Cerrar chat"><i class="fa-solid fa-xmark"></i></button>
    </header>

    <div class="lula-mensajes" id="lula-mensajes" aria-live="polite" aria-relevant="additions"></div>

    <div class="lula-sugerencias" id="lula-sugerencias">
      <button type="button" data-texto="Quiero rastrear mi paquete">Rastrear mi paquete</button>
      <button type="button" data-texto="Quiero cotizar un envío">Cotizar un envío</button>
      <button type="button" data-texto="Tengo un problema con mi envío">Tengo un problema</button>
    </div>

    <form class="lula-form" id="lula-form" autocomplete="off">
      <label for="lula-texto" class="visually-hidden">Escribe tu mensaje</label>
      <textarea id="lula-texto" rows="1" maxlength="1000" placeholder="Escribe tu mensaje…" required></textarea>
      <button type="submit" class="lula-enviar" aria-label="Enviar"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
    <p class="lula-legal">Las conversaciones se guardan para mejorar el servicio.</p>
  </section>
</div>
