{% extends 'base.html' %}
{% block title %}{{ titulo }} · Balula Express{% endblock %}

{% block content %}
<section class="track-hero" style="padding: 5rem 0">
  <div class="container text-center" style="max-width: 560px">
    <p class="display-font fw-800 mb-0" style="font-size: 5rem; line-height: 1; color: var(--b-200)">{{ codigo }}</p>
    <h1 class="h2 mt-2 mb-3">{{ titulo }}</h1>
    <p class="section-lead mx-auto mb-4">{{ mensaje }}</p>
    <div class="d-flex flex-wrap gap-2 justify-content-center">
      <a href="{{ url_for('home') }}" class="btn btn-primary">Ir al inicio</a>
      <a href="{{ url_for('rastreo') }}" class="btn btn-outline-primary">Rastrear un paquete</a>
    </div>
  </div>
</section>
{% endblock %}
